name: Idea or improvement
description: Suggest a feature, enhancement, or new content
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the idea and the problem or opportunity it addresses.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Possible approach
      description: Any thoughts on how it could work, alternatives, or references.
  - type: dropdown
    id: help
    attributes:
      label: Would you like to help build it?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
